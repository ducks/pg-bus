[package]
name = "pg-bus"
version = "20261005.0.0"
edition = "2024"
description = "A message bus on PostgreSQL: publish inside your transaction, resume from a cursor, deliver over SSE."
license = "MIT"
repository = "https://github.com/ducks/pg-bus"
keywords = ["postgres", "pubsub", "sse", "messagebus", "outbox"]
categories = ["database", "web-programming"]
readme = "README.md"
documentation = "https://docs.rs/pg-bus"
# if-let chains.
rust-version = "1.88"
# The library and what explains it; the tests and the bench need a database.
include = ["src/**", "README.md", "LICENSE", "BENCH.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde_json = "1"
tracing = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
axum = ["dep:axum", "dep:futures-util", "dep:serde"]

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
